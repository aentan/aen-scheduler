app = "aen-scheduler"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[build.args]
  VITE_APP_HOST = "aen-scheduler.fly.dev"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Scale to zero when idle. The machine cold-starts on the next HTTP request
  # (~1-2s). Scheduled jobs (reminders, Google token refresh) are driven by an
  # external ping to /api/internal/cron/* — see .github/workflows/cron.yml —
  # since the in-process @Cron does not fire while the machine is stopped.
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
